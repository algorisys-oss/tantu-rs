[package]
name = "tantu"
description = "A cross-platform desktop UI framework with Flutter-style authoring and pluggable renderers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["wgpu", "winit", "default-theme"]
## GPU renderer (tantu-render-wgpu).
wgpu = ["dep:tantu-render-wgpu"]
## CPU renderer (tantu-render-soft).
soft = ["dep:tantu-render-soft"]
## winit platform shell (tantu-platform-winit).
winit = ["dep:tantu-platform-winit"]
## Default themes (tantu-theme).
default-theme = ["dep:tantu-theme"]

[dependencies]
tantu-core = { workspace = true }
tantu-reactive = { workspace = true }
tantu-scene = { workspace = true }
tantu-text = { workspace = true }
tantu-layout = { workspace = true }
tantu-view = { workspace = true }
tantu-widgets = { workspace = true }
tantu-a11y = { workspace = true }
tantu-platform = { workspace = true }
tantu-theme = { workspace = true, optional = true }
tantu-render-wgpu = { workspace = true, optional = true }
tantu-render-soft = { workspace = true, optional = true }
tantu-platform-winit = { workspace = true, optional = true }
