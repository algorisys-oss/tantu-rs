[package]
name = "tantu-widgets"
description = "The standard Tantu widget set."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
tantu-view = { workspace = true }
# Diagnostics (AGENTS.md: `tracing`), as in tantu-layout and tantu-view.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

# WidgetTester for widget tests (tantu-test depends on tantu-view only, so no cycle).
[dev-dependencies]
tantu-test = { workspace = true }
