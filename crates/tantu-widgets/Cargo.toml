[package]
name = "tantu-widgets"
description = "The standard Tantu widget set."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# `benches/scenarios.rs` is included by the bench and a test, not a bench of its own.
autobenches = false

[features]
default = ["material-icons"]
## Embeds Material Icons Regular (Apache 2.0, 357 KB) and the `Icons` table.
material-icons = []

[lints]
workspace = true

[dependencies]
tantu-view = { workspace = true }
# The theme's tokens (ADR 0012).
tantu-theme = { workspace = true }
# Diagnostics (AGENTS.md: `tracing`), as in tantu-layout and tantu-view.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# PNG decoding for `Image` (the same crate the render crates use for goldens).
png = "0.18.1"
# Grapheme and word boundaries for the text editing model (already built for the text stack).
unicode-segmentation = "1.13.3"

# WidgetTester for widget tests (tantu-test depends on tantu-view only, so no cycle).
[dev-dependencies]
tantu-test = { workspace = true }
# Benchmark harness (spec docs/specs/widgets/data-grid.md), as in tantu-layout.
criterion = { version = "0.7.0", default-features = false }

[[bench]]
name = "grid"
harness = false
