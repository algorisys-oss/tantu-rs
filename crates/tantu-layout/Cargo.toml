[package]
name = "tantu-layout"
description = "Flutter-style `BoxConstraints` layout protocol and layout algorithms."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

autobenches = false

[lints]
workspace = true

[dependencies]
tantu-core = { workspace = true }
# Diagnostics (AGENTS.md: `tracing`, never `println!`). Already in the workspace through wgpu.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

[dev-dependencies]
# Benchmark harness (spec docs/specs/layout/benchmarks.md), as in tantu-reactive.
criterion = { version = "0.7.0", default-features = false }

[[bench]]
name = "layout"
harness = false
