[package]
name = "tantu-platform-winit"
description = "winit implementation of the Tantu `Platform` trait."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
## Native file and message dialogs through `rfd` (ADR 0017).
native-dialogs = ["dep:rfd"]
## OS notifications through `notify-rust` (ADR 0017).
notifications = ["dep:notify-rust"]
## Native menu bars through `muda` on macOS and Windows (ADR 0017 part 2).
native-menus = ["dep:muda"]
## The system tray through `tray-icon` on macOS and Windows (ADR 0017 part 3).
tray = ["dep:tray-icon", "dep:muda"]

[dependencies]
tantu-core = { workspace = true }
tantu-platform = { workspace = true }
# Default features: X11, Wayland (loaded at run time), client-side decorations, rwh 0.6.
winit = "0.30.13"
# The AccessKit platform adapter for winit windows (ADR 0013); 0.32 pairs with winit 0.30.
accesskit_winit = "0.32.2"
# The OS clipboard (plain text) (PLATFORM-WINIT-17); the crate egui and other winit
# toolkits use. Default features: X11, macOS, Windows; Wayland goes through XWayland.
arboard = "3.7.0"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# Native file and message dialogs (ADR 0017), opt-in. Default backend on Linux: the xdg
# desktop portal over D-Bus (no GTK); message dialogs there use Zenity.
rfd = { version = "0.17.2", optional = true }
# OS notifications (ADR 0017), opt-in; D-Bus (zbus) on Linux. 4.17: 4.18 needs Rust 1.89.
notify-rust = { version = "4.17.0", optional = true }

# Opens a real window; needs the main thread, so it runs without the test harness.
[[test]]
name = "window"
harness = false

# Native menu bars (ADR 0017 part 2), opt-in, macOS and Windows only (no GTK on Linux).
# 0.19.3: 0.20 and later need Rust 1.90, above the MSRV.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
muda = { version = "0.19.3", optional = true, default-features = false }
# The system tray (ADR 0017 part 3), opt-in; 0.24.2 shares muda 0.19 (0.25+ need Rust 1.90).
tray-icon = { version = "0.24.2", optional = true, default-features = false }
