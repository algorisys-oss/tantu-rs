[package]
name = "tantu-text"
description = "Font loading, shaping, bidi and line breaking."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
tantu-core = { workspace = true }
tantu-scene = { workspace = true }
tantu-layout = { workspace = true }
# Shaping, bidi, line breaking and font fallback (ADR 0005); needs Rust 1.88.
parley = "0.12.0"
# parley's fontique, with fontconfig loaded at run time on Linux (dlopen) instead of linked at
# build time, so building needs no fontconfig development package.
fontique = { version = "0.12.0", default-features = false, features = ["fontconfig-dlopen"] }
