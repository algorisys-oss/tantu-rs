[package]
name = "tantu-render-wgpu"
description = "GPU renderer for Tantu scenes (Vulkan, Metal, DX12, GL)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
tantu-core = { workspace = true }
tantu-scene = { workspace = true }
tantu-text = { workspace = true }
wgpu = "30.0.1"
# Blocks on wgpu's async adapter, device and buffer-mapping requests.
pollster = "0.4.0"
raw-window-handle = "0.6.2"


[dev-dependencies]
# Reference Scenes and goldens (spec docs/specs/render-conformance/conformance.md), and PNG
# output of failed renderings.
tantu-render-conformance = { workspace = true }
png = "0.18.1"
# TextStyleKey, for the glyph-run tests (tests/text.rs).
tantu-layout = { workspace = true }
