[package]
name = "tantu-render-soft"
description = "CPU renderer for Tantu scenes, built on tiny-skia."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
tantu-core = { workspace = true }
tantu-scene = { workspace = true }
tantu-text = { workspace = true }
# CPU rasterizer. PNG support off: `png` below does lossless straight-alpha I/O.
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }
png = "0.18.1"


[dev-dependencies]
# Reference Scenes and goldens (spec docs/specs/render-conformance/conformance.md).
tantu-render-conformance = { workspace = true }
# TextStyleKey, for the glyph-run tests (tests/text.rs).
tantu-layout = { workspace = true }
