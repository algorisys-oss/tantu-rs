<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1300" viewBox="0 0 1440 1300" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- Source of truth for the tantu architecture diagram. Edit this file, then regenerate the PNG:
       inkscape docs/architecture/tantu-architecture.svg -o docs/architecture/tantu-architecture.png -w 2880
       Described in docs/architecture.md. Keep both in sync with AGENTS.md / ADRs. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <style>
      .t  { font-size: 16px; font-weight: 700; fill: #111827; text-anchor: middle; }
      .b  { font-size: 12.5px; fill: #374151; text-anchor: middle; }
      .c  { font-size: 11.5px; fill: #6b7280; text-anchor: middle; font-family: 'JetBrains Mono', Consolas, monospace; }
      .lbl { font-size: 12px; font-style: italic; fill: #374151; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
      .edge { stroke: #374151; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .side { stroke: #374151; stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .pipe { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2.2; }
      .svc  { fill: #fffbeb; stroke: #d97706; stroke-width: 2.2; }
      .plat { fill: #f0fdfa; stroke: #0d9488; stroke-width: 2.2; }
      .rend { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.2; }
      .a11y { fill: #fdf2f8; stroke: #db2777; stroke-width: 2.2; }
      .tool { fill: #f8fafc; stroke: #475569; stroke-width: 2.2; }
    </style>
  </defs>

  <rect width="1440" height="1300" fill="#ffffff"/>

  <!-- Title -->
  <text x="720" y="48" style="font-size:26px;font-weight:700;fill:#111827;text-anchor:middle">Tantu — architecture</text>
  <text x="720" y="76" style="font-size:14px;fill:#4b5563;text-anchor:middle">Compose once. Render your way. · AI-driven development of a cross-platform UI framework in Rust</text>

  <!-- ============ Edges (drawn first so boxes sit on top) ============ -->
  <!-- main pipeline -->
  <path class="edge" d="M700,210 L700,268"/>
  <text class="lbl" x="712" y="244">build</text>
  <path class="edge" d="M700,350 L700,408"/>
  <text class="lbl" x="712" y="384">reconcile (keyed)</text>
  <path class="edge" d="M700,490 L700,548"/>
  <text class="lbl" x="712" y="524">create / update render objects</text>
  <path class="edge" d="M585,650 L585,718"/>
  <text class="lbl" x="597" y="690">paint (off-screen culled)</text>
  <path class="side" d="M880,650 L880,718"/>
  <text class="lbl" x="892" y="690">semantics</text>
  <path class="edge" d="M585,830 L585,888"/>
  <text class="lbl" x="597" y="856">submit</text>
  <path class="edge" d="M540,960 L375,1028"/>
  <path class="edge" d="M585,960 L645,1028"/>
  <path class="edge" d="M640,960 L915,1028"/>

  <!-- facade -->
  <path class="edge" d="M360,165 L468,165"/>
  <text class="lbl" x="372" y="155">runs frame loop</text>

  <!-- reactive -->
  <path class="edge" d="M930,160 L1180,248"/>
  <text class="lbl" x="1000" y="170">read / write signals</text>
  <path class="edge" d="M1060,340 L932,440"/>
  <text class="lbl" x="945" y="410">mark dependents dirty</text>

  <!-- layout + text -->
  <path class="edge" d="M1060,520 L982,570"/>
  <text class="lbl" x="1004" y="534">layout</text>
  <path class="edge" d="M1060,690 L982,630"/>
  <text class="lbl" x="992" y="680">shaped text</text>
  <path class="side" d="M1235,640 L1235,562"/>
  <text class="lbl" x="1245" y="606">implements TextMeasure</text>

  <!-- events -->
  <path class="edge" d="M360,480 L418,580"/>
  <text class="lbl" x="376" y="505">① hit-test</text>
  <path class="edge" d="M330,400 L468,198"/>
  <text class="lbl" x="232" y="300">② dispatch to handlers</text>
  <text class="lbl" x="232" y="316">(capture / bubble, focus)</text>

  <!-- platform -->
  <path class="edge" d="M195,588 L195,502"/>
  <text class="lbl" x="207" y="550">raw input, IME, resize, DPI</text>
  <path class="side" d="M195,788 L195,702"/>
  <text class="lbl" x="207" y="750">implements</text>
  <path class="side" d="M230,890 L330,1028"/>
  <text class="lbl" x="200" y="975">window surface</text>

  <!-- a11y to platform adapter -->
  <path class="side" d="M880,830 L880,874 L390,874 L390,660 L362,660"/>
  <text class="lbl" x="770" y="864">AccessKit updates → platform adapter</text>

  <!-- tester -->
  <path class="side" d="M700,1178 L645,1122"/>
  <path class="side" d="M880,1178 L915,1122"/>
  <text class="lbl" x="738" y="1156">drives &amp; inspects</text>

  <!-- conformance -->
  <path class="side" d="M1235,1122 L1235,1142 L585,1142 L585,1124"/>
  <path class="side" d="M1235,1142 L375,1142 L375,1124"/>
  <text class="lbl" x="1052" y="1160">golden diff (tests)</text>

  <!-- ============ Boxes ============ -->
  <!-- facade -->
  <rect class="tool" x="30" y="120" width="330" height="90" rx="10"/>
  <text class="t" x="195" y="150">tantu (facade)</text>
  <text class="b" x="195" y="172">App runner · prelude · one context per window</text>
  <text class="c" x="195" y="194">tantu</text>

  <!-- App code -->
  <rect class="pipe" x="470" y="120" width="460" height="90" rx="10"/>
  <text class="t" x="700" y="150">App code</text>
  <text class="b" x="700" y="172">widgets built with plain Rust builders; state in signals; themed</text>
  <text class="c" x="700" y="194">user crate · tantu-widgets · tantu-theme</text>

  <!-- View tree -->
  <rect class="pipe" x="470" y="270" width="460" height="80" rx="10"/>
  <text class="t" x="700" y="298">View tree</text>
  <text class="b" x="700" y="318">cheap declarative descriptions (like Flutter Widgets)</text>
  <text class="c" x="700" y="338">tantu-view</text>

  <!-- Element tree -->
  <rect class="pipe" x="470" y="410" width="460" height="80" rx="10"/>
  <text class="t" x="700" y="438">Element tree</text>
  <text class="b" x="700" y="458">retained · identity + state · arena-backed · dirty tracking</text>
  <text class="c" x="700" y="478">tantu-view</text>

  <!-- Render tree -->
  <rect class="pipe" x="420" y="550" width="560" height="100" rx="10"/>
  <text class="t" x="700" y="578">Render tree</text>
  <text class="b" x="700" y="600">RenderBox protocol: constraints ↓ · sizes ↑ · parent sets offsets</text>
  <text class="b" x="700" y="619">layout · paint · hit-test · relayout boundaries</text>
  <text class="c" x="700" y="639">layout tree: tantu-layout · paint, hit-test: tantu-view</text>

  <!-- Scene -->
  <rect class="rend" x="420" y="720" width="330" height="110" rx="10"/>
  <text class="t" x="585" y="748">Scene (display list)</text>
  <text class="b" x="585" y="769">flat, serializable, versioned commands</text>
  <text class="b" x="585" y="787">each with element id + z-index</text>
  <text class="b" x="585" y="805">rects · paths · glyph runs · clips · layers · custom</text>
  <text class="c" x="585" y="822">tantu-scene</text>

  <!-- A11y -->
  <rect class="a11y" x="780" y="720" width="200" height="110" rx="10"/>
  <text class="t" x="880" y="748">AccessKit tree</text>
  <text class="b" x="880" y="769">roles, names, states,</text>
  <text class="b" x="880" y="787">actions for screen</text>
  <text class="b" x="880" y="805">readers</text>
  <text class="c" x="880" y="822">tantu-a11y</text>

  <!-- Renderer trait -->
  <rect class="rend" x="420" y="890" width="330" height="70" rx="10"/>
  <text class="t" x="585" y="918">Renderer trait</text>
  <text class="b" x="585" y="940">consumes Scene; never calls back into UI</text>
  <text class="c" x="585" y="954">tantu-scene</text>

  <!-- Backends -->
  <rect class="rend" x="250" y="1030" width="250" height="90" rx="10"/>
  <text class="t" x="375" y="1058">tantu-render-wgpu</text>
  <text class="b" x="375" y="1080">GPU: Vulkan · Metal · DX12 · GL</text>
  <text class="b" x="375" y="1100">glyphs via tantu-text</text>

  <rect class="rend" x="520" y="1030" width="250" height="90" rx="10"/>
  <text class="t" x="645" y="1058">tantu-render-soft</text>
  <text class="b" x="645" y="1080">CPU via tiny-skia → pixels / PNG</text>
  <text class="b" x="645" y="1100">fallback, VMs, RDP, CI goldens</text>

  <rect class="rend" x="790" y="1030" width="250" height="90" rx="10"/>
  <text class="t" x="915" y="1058">tantu-render-headless</text>
  <text class="b" x="915" y="1080">records Scenes</text>
  <text class="b" x="915" y="1100">for tests and assertions</text>

  <rect class="rend" x="1060" y="1030" width="350" height="90" rx="10"/>
  <text class="t" x="1235" y="1056">tantu-render-conformance</text>
  <text class="b" x="1235" y="1076">reference Scenes · embedded goldens</text>
  <text class="b" x="1235" y="1094">edge-aware cross-backend comparison</text>
  <text class="c" x="1235" y="1112">every backend, incl. future web / egui</text>

  <!-- Tester -->
  <rect class="tool" x="600" y="1180" width="420" height="70" rx="10"/>
  <text class="t" x="810" y="1208">tantu-test · WidgetTester</text>
  <text class="b" x="810" y="1230">pump frames · simulate input · find by key · golden PNGs</text>

  <!-- Reactive -->
  <rect class="svc" x="1060" y="250" width="350" height="120" rx="10"/>
  <text class="t" x="1235" y="278">Reactive runtime</text>
  <text class="b" x="1235" y="300">Signal · Memo · Effect · batch · scoped disposal</text>
  <text class="b" x="1235" y="320">glitch-free; closures capture Copy handles</text>
  <text class="b" x="1235" y="340">no whole-subtree setState rebuilds</text>
  <text class="c" x="1235" y="360">tantu-reactive</text>

  <!-- Layout -->
  <rect class="svc" x="1060" y="450" width="350" height="110" rx="10"/>
  <text class="t" x="1235" y="478">Layout</text>
  <text class="b" x="1235" y="500">BoxConstraints · Flex · Stack · Wrap · Align …</text>
  <text class="b" x="1235" y="520">TextMeasure trait + paragraph measure cache</text>
  <text class="b" x="1235" y="538">(never depends on the text crate)</text>
  <text class="c" x="1235" y="554">tantu-layout</text>

  <!-- Text -->
  <rect class="svc" x="1060" y="640" width="350" height="120" rx="10"/>
  <text class="t" x="1235" y="668">Text</text>
  <text class="b" x="1235" y="690">parley · swash · fontique</text>
  <text class="b" x="1235" y="710">shaping · bidi · line breaking · font fallback</text>
  <text class="b" x="1235" y="730">glyph runs into the Scene</text>
  <text class="c" x="1235" y="750">tantu-text</text>

  <!-- Events -->
  <rect class="plat" x="30" y="400" width="330" height="100" rx="10"/>
  <text class="t" x="195" y="428">Events</text>
  <text class="b" x="195" y="450">pointer · keyboard · IME · focus</text>
  <text class="b" x="195" y="470">pointer capture · cursor icons · shortcuts</text>
  <text class="c" x="195" y="490">tantu-view (dispatch)</text>

  <!-- Platform trait -->
  <rect class="plat" x="30" y="590" width="330" height="110" rx="10"/>
  <text class="t" x="195" y="618">Platform trait</text>
  <text class="b" x="195" y="640">windows · input · IME · clipboard · DnD</text>
  <text class="b" x="195" y="660">dialogs · menus · tray · AccessKit adapter</text>
  <text class="c" x="195" y="686">tantu-platform</text>

  <!-- winit -->
  <rect class="plat" x="30" y="790" width="330" height="100" rx="10"/>
  <text class="t" x="195" y="818">tantu-platform-winit</text>
  <text class="b" x="195" y="840">Windows · macOS</text>
  <text class="b" x="195" y="860">Linux (Wayland + X11)</text>
  <text class="c" x="195" y="880">winit (default shell)</text>

  <!-- ============ Legend ============ -->
  <g transform="translate(30,1160)">
    <text x="0" y="0" style="font-size:13px;font-weight:700;fill:#111827">Legend</text>
    <path class="edge" d="M0,22 L50,22"/><text x="60" y="26" style="font-size:12px;fill:#374151">per-frame data flow</text>
    <path class="side" d="M200,22 L250,22"/><text x="260" y="26" style="font-size:12px;fill:#374151">implements / side channel</text>
    <rect class="pipe" x="0" y="40" width="18" height="14" rx="3"/><text x="24" y="52" style="font-size:12px;fill:#374151">UI pipeline</text>
    <rect class="svc" x="110" y="40" width="18" height="14" rx="3"/><text x="134" y="52" style="font-size:12px;fill:#374151">core services</text>
    <rect class="plat" x="235" y="40" width="18" height="14" rx="3"/><text x="259" y="52" style="font-size:12px;fill:#374151">platform</text>
    <rect class="rend" x="330" y="40" width="18" height="14" rx="3"/><text x="354" y="52" style="font-size:12px;fill:#374151">rendering</text>
    <rect class="a11y" x="430" y="40" width="18" height="14" rx="3"/><text x="454" y="52" style="font-size:12px;fill:#374151">a11y</text>
    <text x="0" y="80" style="font-size:12px;fill:#4b5563">Frame: signal write → dirty elements → rebuild → relayout → repaint → Scene → Renderer</text>
    <text x="0" y="98" style="font-size:12px;fill:#4b5563">tantu-core (geometry, color, ids, arena) sits under every crate and is not drawn.</text>
  </g>
</svg>
