[package]
name = "gallery"
description = "The Tantu widget gallery: every widget, section by section."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# Native dialogs and notifications for the "desktop" card (GALLERY-56) and the native
# menu bar on macOS and Windows (GALLERY-57); ADR 0017.
tantu = { workspace = true, features = ["native-dialogs", "notifications", "native-menus"] }

[dev-dependencies]
tantu-test = { workspace = true }
tantu-render-headless = { workspace = true }
